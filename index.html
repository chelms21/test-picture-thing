<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random NLT Bible Verse</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #222;
      text-align: center;
      padding: 1em;
      /* Smooth fade effect when changing images */
      transition: background-image 1s ease-in-out; 
      /* Cover the whole viewport without stretching */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      color: #1a3c7a;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    #verse-container {
      max-width: 700px;
      /* Fallback background color if image fails to load */
      background: rgba(255, 255, 255, 0.85); 
      /* Backdrop filter adds a sleek frosted glass effect over photos */
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      padding: 25px 35px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      margin-bottom: 20px;
      text-align: center;
    }

    #verse {
      font-size: 1.5rem;
      line-height: 1.6;
      margin-bottom: 15px;
      font-weight: 500;
    }

    #reference {
      font-style: italic;
      color: #444;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="verse-container">
    <div id="verse">Loading verse...</div>
    <div id="reference"></div>
  </div>

  <script src="verses.js"></script>
  <script>
    // List of natural fallback scenery keywords if no contextual matches are found
    const defaultScenery = ['nature', 'mountains', 'forest', 'sunset', 'sky', 'hills'];

    // Map specific textual words directly to visual scenic themes
    const themeKeywords = {
      light: 'sunlight,sunrays',
      dark: 'night,stars',
      afraid: 'peaceful,calm',
      courageous: 'mountain,peak',
      shepherd: 'meadow,sheep',
      refuge: 'fortress,rock',
      earth: 'planet,space',
      heavens: 'galaxy,sky',
      sea: 'ocean,waves',
      water: 'river,lake',
      young: 'path,trees',
      heart: 'sunrise,morning'
    };

    function setContextualBackground(verseObject) {
      let selectedTag = "";

      // 1. First priority: Check if the verse array has explicit predefined tags
      if (verseObject.tags) {
        const tagsArray = verseObject.tags.split(',');
        selectedTag = tagsArray[Math.floor(Math.random() * tagsArray.length)];
      } 
      
      // 2. Second priority: Scan the text dynamically for matched themes
      if (!selectedTag) {
        const lowerText = verseObject.text.toLowerCase();
        for (const [key, value] of Object.entries(themeKeywords)) {
          if (lowerText.includes(key)) {
            const options = value.split(',');
            selectedTag = options[Math.floor(Math.random() * options.length)];
            break; // Grab the first strong match found
          }
        }
      }

      // 3. Third priority: Fallback to general nature imagery if no context triggers match
      if (!selectedTag) {
        selectedTag = defaultScenery[Math.floor(Math.random() * defaultScenery.length)];
      }

      // Generate a cache-buster seed so consecutive reloads with same keyword pull new views
      const randomSeed = Math.floor(Math.random() * 10000);
      
      // Request an high-resolution thematic image matching the verse tag
      const imageUrl = `https://loremflickr.com/1600/900/${selectedTag}?random=${randomSeed}`;

      // Create a smooth transition overlay pre-load sequence
      const img = new Image();
      img.src = imageUrl;
      img.onload = function() {
        document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), url('${imageUrl}')`;
      };
    }

    // Refactored to coordinate the verse selection and background assignment together
    function showVerseAndBackground() {
      if (!VERSES || VERSES.length === 0) {
        document.getElementById("verse").innerText = "No verses loaded.";
        return;
      }
      
      // Pick the random verse first
      const randomVerse = VERSES[Math.floor(Math.random() * VERSES.length)];
      
      // Display the content text
      document.getElementById("verse").innerText = randomVerse.text;
      document.getElementById("reference").innerText = randomVerse.ref;
      
      // Fire the background fetch utilizing the chosen verse object's data
      setContextualBackground(randomVerse);
    }

    window.onload = function() {
      showVerseAndBackground();
    };
  </script>
</body>
</html>
