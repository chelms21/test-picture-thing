<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random NLT Bible Verse</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #222;
      text-align: center;
      padding: 1em;
      /* Soft fallback color while the very first image loads */
      background-color: #1a2a3a; 
      position: relative;
      overflow-x: hidden;
    }

    /* This hidden layer handles the fast background image rendering */
    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      opacity: 0;
      /* Faster 0.4s transition so it snaps in cleanly once downloaded */
      transition: opacity 0.4s ease-in-out; 
    }

    /* Class injected by JS once the image finishes downloading */
    body.bg-loaded::after {
      opacity: 1;
    }

    #verse-container {
      max-width: 700px;
      background: rgba(255, 255, 255, 0.88); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 25px 35px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      text-align: center;
      z-index: 1; /* Ensures text stays above the pseudo-element background */
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      color: #1a3c7a;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    #verse {
      font-size: 1.5rem;
      line-height: 1.6;
      margin-bottom: 15px;
      font-weight: 500;
    }

    #reference {
      font-style: italic;
      color: #444;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="verse-container">
    <div id="verse">Loading verse...</div>
    <div id="reference"></div>
  </div>

  <script src="verses.js"></script>
  <script>
    const defaultScenery = ['nature', 'mountains', 'forest', 'sunset', 'sky', 'hills'];

    const themeKeywords = {
      light: 'sunlight',
      dark: 'stars',
      afraid: 'calm',
      courageous: 'mountain',
      shepherd: 'meadow',
      refuge: 'rock',
      earth: 'space',
      heavens: 'sky',
      sea: 'ocean',
      water: 'river',
      young: 'path',
      heart: 'sunrise'
    };

    function setContextualBackground(verseObject) {
      let selectedTag = "";

      // 1. Check custom tags
      if (verseObject.tags) {
        const tagsArray = verseObject.tags.split(',');
        selectedTag = tagsArray[Math.floor(Math.random() * tagsArray.length)].trim();
      } 
      
      // 2. Check keyword fallback map
      if (!selectedTag) {
        const lowerText = verseObject.text.toLowerCase();
        for (const [key, value] of Object.entries(themeKeywords)) {
          if (lowerText.includes(key)) {
            selectedTag = value;
            break;
          }
        }
      }

      // 3. Fallback to default scenery
      if (!selectedTag) {
        selectedTag = defaultScenery[Math.floor(Math.random() * defaultScenery.length)];
      }

      // Generate a truly random cache-buster string using time and random numbers
      const cacheBuster = Date.now() + Math.floor(Math.random() * 1000);
      
      // Highly optimized, random contextual URL via Lorem Picsum
      const imageUrl = `https://picsum.photos/1200/800?${selectedTag}&blur=1&random=${cacheBuster}`;

      // Remove the old loaded state class so it can fade cleanly again
      document.body.classList.remove('bg-loaded');

      // Create an in-memory image object to preload the asset completely before showing it
      const imgPreloader = new Image();
      imgPreloader.src = imageUrl;

      imgPreloader.onload = function() {
        // Find or create a dynamic style block to update our CSS pseudo-element rule safely
        let bgStyle = document.getElementById('dynamic-bg-style');
        if (!bgStyle) {
          bgStyle = document.createElement('style');
          bgStyle.id = 'dynamic-bg-style';
          document.head.appendChild(bgStyle);
        }
        
        // Inject the preloaded source URL with its text-protection dark overlay layout
        bgStyle.innerHTML = `body::after { background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('${imageUrl}'); }`;
        
        // Add class to trigger the smooth CSS opacity fade-in instantly
        document.body.classList.add('bg-loaded');
      };
    }

    function showVerseAndBackground() {
      if (!VERSES || VERSES.length === 0) {
        document.getElementById("verse").innerText = "No verses loaded.";
        return;
      }
      
      const randomVerse = VERSES[Math.floor(Math.random() * VERSES.length)];
      
      document.getElementById("verse").innerText = randomVerse.text;
      document.getElementById("reference").innerText = randomVerse.ref;
      
      setContextualBackground(randomVerse);
    }

    window.onload = function() {
      showVerseAndBackground();
    };
  </script>
</body>
</html>
