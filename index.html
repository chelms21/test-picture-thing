<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random NLT Bible Verse</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #222;
      text-align: center;
      padding: 1em;
      /* Smooth fade effect when changing images */
      transition: background-image 1s ease-in-out; 
      /* Cover the whole viewport without stretching */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      color: #1a3c7a;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    #verse-container {
      max-width: 700px;
      /* Fallback background color if image fails to load */
      background: rgba(255, 255, 255, 0.85); 
      /* Backdrop filter adds a sleek frosted glass effect over photos */
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      padding: 25px 35px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      margin-bottom: 20px;
      text-align: center;
    }

    #verse {
      font-size: 1.5rem;
      line-height: 1.6;
      margin-bottom: 15px;
      font-weight: 500;
    }

    #reference {
      font-style: italic;
      color: #444;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="verse-container">
    <div id="verse">Loading verse...</div>
    <div id="reference"></div>
  </div>

  <script src="verses.js"></script>
  <script>
    // Array of curated scenery keywords or direct image URLs
    const sceneryKeywords = [
      'nature', 'mountains', 'forest', 'ocean', 'sunset', 
      'stars', 'hills', 'river', 'sky', 'desert'
    ];

    // Set a truly random scenery background photo
    function setRandomScenery() {
      // Pick a random keyword from the array to give Unsplash context on what to search
      const randomKeyword = sceneryKeywords[Math.floor(Math.random() * sceneryKeywords.length)];
      
      // Generate a random seed number so the browser doesn't cache the image
      const randomSeed = Math.floor(Math.random() * 1000);
      
      // Corrected URL: Uses a completely random image filtered by dimensions and your keyword
      const imageUrl = `https://images.unsplash.com/random/1600x900/?${randomKeyword}&sig=${randomSeed}`;
      
      // Apply image with a subtle dark overlay layer to keep text legible
      document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('${imageUrl}')`;
    }

    // Show random verse immediately
    function showVerse() {
      if (!VERSES || VERSES.length === 0) {
        document.getElementById("verse").innerText = "No verses loaded.";
        return;
      }
      const random = VERSES[Math.floor(Math.random() * VERSES.length)];
      document.getElementById("verse").innerText = random.text;
      document.getElementById("reference").innerText = random.ref;
    }

    window.onload = function() {
      setRandomScenery();
      showVerse();
    };
  </script>
</body>
</html>
